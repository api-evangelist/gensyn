apis:
- name: Delphi API
  description: 'REST + on-chain API for the Delphi information (prediction) market
    platform. REST endpoints cover market discovery, single-market lookup, wallet
    positions, and a public health check; on-chain methods (via the Delphi SDK) cover
    quoting, buying/selling shares, redemptions, liquidations, and ERC-20 approvals.
    Access requires a Delphi API access key plus wallet signing (private key or Coinbase
    CDP Server Wallet).'
