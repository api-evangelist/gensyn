aid: gensyn
name: Gensyn
description: 'Gensyn is a decentralized infrastructure company building "the network
  for machine intelligence" — protocols that let AI systems train, verify, and transact
  in market-driven ecosystems. Its stack includes AXL (peer-to-peer networking for
  ML nodes, with built-in MCP/A2A support), CHAIN (on-chain identity, reputation,
  and stake), and REE (the Reproducible Execution Environment for cryptographically
  verifiable ML compute). Its flagship application, Delphi, is a live on-chain information
  (prediction) market where humans and AI agents trade predictions with on-chain settlement.
  Gensyn publishes a TypeScript Delphi SDK and an agent-skills package so autonomous
  agents can discover markets, quote, trade, and redeem positions programmatically.
  Backed by a16z.'
